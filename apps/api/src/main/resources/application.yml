server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  application:
    name: sl-tours-api
  servlet:
    multipart:
      max-file-size: ${SLTOURS_MAX_UPLOAD_FILE:15MB}
      max-request-size: ${SLTOURS_MAX_UPLOAD_REQUEST:100MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sltours}
    username: ${SPRING_DATASOURCE_USERNAME:sltours}
    password: ${SPRING_DATASOURCE_PASSWORD:sltours}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

sltours:
  # Canonical URLs, sitemap and Open Graph links.
  public-base-url: ${SLTOURS_PUBLIC_BASE_URL:https://sl-tours.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  security:
    admin-username: ${SLTOURS_ADMIN_USERNAME:admin@sltours.local}
    admin-password: ${SLTOURS_ADMIN_PASSWORD:change-me-in-env}
    # Signed-in users are signed out after this much inactivity; background polling does not count.
    idle-timeout: ${SLTOURS_IDLE_TIMEOUT:30m}
  inspections:
    # Default: a collection without safety defects waits for an administrator to approve the release.
    collection-approval-required: ${SLTOURS_COLLECTION_APPROVAL_REQUIRED:true}
    min-vehicle-photos: ${SLTOURS_INSPECTION_MIN_PHOTOS:4}
  pricing:
    # Seeded sample rates are never shown as prices unless this is true (dev profile only).
    allow-sample-rates: false
  storage:
    # Private uploads (inspection photos, selfies, driver documents). Mount a persistent Docker volume here.
    local-root: ${SLTOURS_MEDIA_ROOT:./data/media}
    max-image-bytes: ${SLTOURS_MAX_IMAGE_BYTES:10485760}
    max-document-bytes: ${SLTOURS_MAX_DOCUMENT_BYTES:15728640}
