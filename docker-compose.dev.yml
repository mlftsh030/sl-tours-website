services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sltours}
      POSTGRES_USER: ${POSTGRES_USER:-sltours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sltours}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  api:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace/apps/api
    command: ./mvnw spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sltours}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sltours}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sltours}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SLTOURS_ADMIN_USERNAME: ${SLTOURS_ADMIN_USERNAME:-admin@sltours.local}
      SLTOURS_ADMIN_PASSWORD: ${SLTOURS_ADMIN_PASSWORD:-change-me-in-env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      SLTOURS_MEDIA_ROOT: /var/lib/sltours/media
      SLTOURS_DEV_DRIVER_PASSWORD: ${SLTOURS_DEV_DRIVER_PASSWORD:-driver-demo-pass}
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      - media-dev-data:/var/lib/sltours/media
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"

  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://api:8080
    volumes:
      - .:/workspace
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres-dev-data:
  maven-cache:
  media-dev-data:
